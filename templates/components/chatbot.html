<div id="chatbot-widget" class="chatbot-container">
    <div class="chatbot-header">
        <div class="chatbot-title">🤖 Don't Panic Assistant</div>
        <button class="chatbot-close" onclick="closeChatbot()">✕</button>
    </div>
    
    <div class="chatbot-messages" id="chatbot-messages">
        <div class="chatbot-message assistant-message">
            <div class="message-text">Hi! 👋 How can I help you today?</div>
        </div>
    </div>
    
    <div class="chatbot-options" id="chatbot-options">
        <button class="chatbot-option-btn" onclick="sendAction('learn_menu')">📚 Learn Concepts</button>
        <button class="chatbot-option-btn" onclick="sendAction('progress')">📊 Check My Progress</button>
        <button class="chatbot-option-btn" onclick="sendAction('help_menu')">💡 Get Help Now</button>
        <button class="chatbot-option-btn" onclick="sendAction('faq_menu')">❓ FAQ</button>
    </div>
</div>

<style>
    .chatbot-widget-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        cursor: pointer;
        font-size: 28px;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        z-index: 999;
        transition: all 0.3s ease;
    }

    .chatbot-widget-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .chatbot-widget-btn:active {
        transform: scale(0.95);
    }

    .chatbot-widget-btn.hidden {
        display: none;
    }

    .chatbot-container {
        position: fixed;
        bottom: 100px;
        right: 30px;
        width: 420px;
        max-height: 650px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        display: flex;
        flex-direction: column;
        z-index: 1000;
        animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .chatbot-header {
        padding: 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 11px 11px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }

    .chatbot-title {
        font-weight: 600;
        font-size: 16px;
    }

    .chatbot-close {
        background: none;
        border: none;
        color: white;
        font-size: 20px;
        cursor: pointer;
        padding: 0;
        width: 24px;
        height: 24px;
    }

    .chatbot-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        background: var(--bg-primary);
        min-height: 200px;
        max-height: 350px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .chatbot-messages::-webkit-scrollbar {
        width: 6px;
    }

    .chatbot-messages::-webkit-scrollbar-track {
        background: transparent;
    }

    .chatbot-messages::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 3px;
    }

    .chatbot-messages::-webkit-scrollbar-thumb:hover {
        background: var(--text-secondary);
    }

    .chatbot-message {
        animation: fadeIn 0.3s ease;
        display: flex;
        flex-direction: column;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes typing {
        0%, 60%, 100% { opacity: 1; }
        30% { opacity: 0.4; }
    }

    .typing-indicator {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        background: var(--bg-hover);
        border-radius: 12px;
        width: fit-content;
    }

    .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--text-secondary);
        animation: typing 1s infinite;
    }

    .typing-dot:nth-child(2) {
        animation-delay: 0.15s;
    }

    .typing-dot:nth-child(3) {
        animation-delay: 0.3s;
    }

    .assistant-message .message-text {
        background: var(--bg-hover);
        color: var(--text-primary);
        padding: 12px 16px;
        border-radius: 12px;
        border-left: 3px solid #667eea;
        word-wrap: break-word;
        white-space: pre-wrap;
        line-height: 1.5;
        font-size: 14px;
        max-width: 100%;
        overflow-wrap: break-word;
    }

    .chatbot-options {
        padding: 16px;
        background: var(--bg-card);
        border-top: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 200px;
        overflow-y: auto;
        flex-shrink: 0;
    }

    .chatbot-options::-webkit-scrollbar {
        width: 6px;
    }

    .chatbot-options::-webkit-scrollbar-track {
        background: transparent;
    }

    .chatbot-options::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 3px;
    }

    .chatbot-option-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s ease;
        text-align: left;
        word-wrap: break-word;
        white-space: normal;
        height: auto;
        min-height: 44px;
        display: flex;
        align-items: center;
    }

    .chatbot-option-btn:hover {
        background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        transform: translateX(4px);
    }

    .chatbot-option-btn:active {
        transform: translateX(2px);
    }

    .chatbot-option-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    @media (max-width: 768px) {
        .chatbot-container {
            width: calc(100vw - 40px);
            right: 20px;
            bottom: 80px;
            max-height: 70vh;
        }

        .chatbot-messages {
            max-height: 40vh;
        }
    }
</style>

<script>
    let chatbotOpen = false;

    function toggleChatbot() {
        const container = document.querySelector('.chatbot-container');
        const btn = document.querySelector('.chatbot-widget-btn');
        
        if (!container) {
            console.error('Chatbot container not found');
            return;
        }
        
        chatbotOpen = !chatbotOpen;
        container.style.display = chatbotOpen ? 'flex' : 'none';
        
        // Hide/show the button
        if (btn) {
            if (chatbotOpen) {
                btn.classList.add('hidden');
            } else {
                btn.classList.remove('hidden');
            }
        }
    }

    function closeChatbot() {
        const btn = document.querySelector('.chatbot-widget-btn');
        
        chatbotOpen = false;
        document.querySelector('.chatbot-container').style.display = 'none';
        
        // Show the button again
        if (btn) {
            btn.classList.remove('hidden');
        }
    }

    function showTypingIndicator() {
        const messagesDiv = document.getElementById('chatbot-messages');
        const typingDiv = document.createElement('div');
        typingDiv.className = 'chatbot-message';
        typingDiv.id = 'typing-indicator';
        typingDiv.innerHTML = `
            <div class="typing-indicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        `;
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function removeTypingIndicator() {
        const typingIndicator = document.getElementById('typing-indicator');
        if (typingIndicator) {
            typingIndicator.remove();
        }
    }

    async function sendAction(action, param = null) {
        try {
            console.log('Sending action:', action, 'param:', param);
            
            showTypingIndicator();
            
            // Ensure animation is visible for at least 1 second
            const startTime = Date.now();
            
            const response = await fetch('/api/assistant/message', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({
                    action: action,
                    param: param
                })
            });

            console.log('Response status:', response.status);
            
            if (!response.ok) {
                const text = await response.text();
                console.error('Response text:', text);
                throw new Error(`HTTP ${response.status}: ${text}`);
            }

            const data = await response.json();
            console.log('Response data:', data);
            
            // Ensure minimum 1 second for animation visibility
            const elapsed = Date.now() - startTime;
            const minDelay = 1000;
            if (elapsed < minDelay) {
                await new Promise(resolve => setTimeout(resolve, minDelay - elapsed));
            }
            
            removeTypingIndicator();
            displayMessage(data);
        } catch (error) {
            removeTypingIndicator();
            console.error('Full error:', error);
            displayMessage({
                type: 'error',
                text: '❌ Error: ' + (error.message || 'Failed to connect to assistant')
            });
        }
    }

    function displayMessage(response) {
        const messagesDiv = document.getElementById('chatbot-messages');
        const optionsDiv = document.getElementById('chatbot-options');

        const messageContainer = document.createElement('div');
        messageContainer.className = 'chatbot-message assistant-message';
        messageContainer.innerHTML = `<div class="message-text">${escapeHtml(response.text)}</div>`;
        messagesDiv.appendChild(messageContainer);

        optionsDiv.innerHTML = '';
        if (response.options && response.options.length > 0) {
            response.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'chatbot-option-btn';
                btn.textContent = option.label;
                btn.onclick = () => {
                    sendAction(option.action, option.param || null);
                };
                optionsDiv.appendChild(btn);
            });
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const container = document.querySelector('.chatbot-container');
        if (container) {
            container.style.display = 'none';
        }
    });
</script>
